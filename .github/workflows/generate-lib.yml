name: Generate Liberty (.lib) Files

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  characterize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System Dependencies
        run: |
          set -eux

          sudo apt-get update -qq
          sudo apt-get install -y ngspice libngspice0-dev

          echo "--- ngspice version ---"
          ngspice --version

      - name: Install Python Dependencies
        run: |
          set -eux

          python -m pip install --upgrade pip

          pip install \
            git+https://github.com/stineje/CharLib.git@2.0.0

          pip install ciel

          # CharLib 2.0.0 requires NumPy 2.x.
          pip install --upgrade "numpy>=2,<3"

          pip check

      - name: Download and Prepare sky130 PDK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux

          export PDK_ROOT=/home/runner/pdk
          mkdir -p "$PDK_ROOT"

          ciel enable \
            --pdk-family sky130 \
            78b7bc32ddb4b6f14f76883c2e2dc5b5de9d1cbc

          echo "--- PDK_ROOT layout ---"
          find "$PDK_ROOT" -maxdepth 2 -type d -print

          test -d "$PDK_ROOT/sky130A"

          # Link the downloaded PDK into the repository.
          ln -sfn "$(readlink -f "$PDK_ROOT/sky130A")" sky130A

          test -f sky130A/libs.tech/ngspice/sky130.lib.spice

          echo "--- Original Monte Carlo expressions ---"
          grep -RInE \
            'mc_mm_switch[[:space:]]*\*[[:space:]]*agauss' \
            sky130A/libs.tech/ngspice || true

          # CharLib is running a deterministic TT characterization.
          # The SKY130 model files contain Monte Carlo expressions such as:
          #
          #   mc_mm_switch*agauss(...)
          #
          # These expressions cause the installed ngspice version to fail
          # with "Cannot compute substitute". Remove only the mismatch term;
          # the nominal TT model values remain unchanged.
          while IFS= read -r -d '' model_file; do
            sed -E -i \
              's/mc_mm_switch[[:space:]]*\*[[:space:]]*agauss\([^)]*\)/0/g' \
              "$model_file"
          done < <(
            find sky130A/libs.tech/ngspice \
              -type f \
              \( -name "*.spice" -o -name "*.inc" -o -name "*.lib" \) \
              -print0
          )

          echo "--- Remaining mismatch expressions ---"
          if grep -RInE \
            'mc_mm_switch[[:space:]]*\*[[:space:]]*agauss' \
            sky130A/libs.tech/ngspice; then
            echo "ERROR: unsupported Monte Carlo expressions remain"
            exit 1
          fi

      - name: Show Characterization Inputs
        run: |
          set -eux

          echo "--- configured files ---"
          find config cells -maxdepth 2 -type f -print

          echo "--- configuration ---"
          cat config/config.yaml

          echo "--- cell netlist ---"
          sed -n '1,240p' cells/buffer_pex_dcfix.spice

          echo "--- model include ---"
          grep -n "sky130" config/config.yaml

          echo "--- CharLib help ---"
          charlib run --help || true

      - name: Run CharLib Characterization
        env:
          PDK_ROOT: /home/runner/pdk
        run: |
          set -uo pipefail

          mkdir -p output
          rm -f charlib.log

          shopt -s nullglob

          configs=(config/*.yaml config/*.yml)

          if [ "${#configs[@]}" -eq 0 ]; then
            echo "ERROR: no CharLib configuration files found"
            exit 1
          fi

          status=0

          for cfg in "${configs[@]}"; do
            echo "===================================================="
            echo "=== Running CharLib on: $cfg"
            echo "===================================================="

            {
              echo "===================================================="
              echo "### $cfg"
              echo "===================================================="
            } >> charlib.log

            if ! charlib run "$cfg" >> charlib.log 2>&1; then
              echo "!!! FAILED: $cfg"
              status=1
            fi
          done

          if [ "$status" -ne 0 ]; then
            echo "=== last 120 lines of charlib.log ==="
            tail -n 120 charlib.log | cut -c1-300
            exit "$status"
          fi

          # Collect generated Liberty files.
          find . \
            -maxdepth 4 \
            -type f \
            -name "*.lib" \
            -not -path "./output/*" \
            -exec cp -f {} output/ \;

          echo "--- output directory ---"
          find output -maxdepth 2 -type f -print

          if ! compgen -G "output/*.lib" > /dev/null; then
            echo "ERROR: CharLib did not generate any .lib files"
            exit 1
          fi

      - name: Upload CharLib Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: charlib-log
          path: charlib.log
          if-no-files-found: ignore

      - name: Upload Liberty Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sky130-lib-files
          path: output/*.lib
          if-no-files-found: error
